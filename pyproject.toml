[project]
name = "cre-underwriting"
version = "0.1.0"
description = "A small, tested commercial real estate acquisition model: NOI, cash flows, IRR, and risk metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_underwriting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
